name: aps-engine
display_name: APS Engine · 智能排产引擎（通用）
version: 0.4.0
kind: skill-plugin
description: >-
  AI 驱动的通用 APS 排产与优化引擎：一句话/照片识别行业（制造业 31 大类 + 细分工艺，
  如药包材 vs 普通注塑）→ CP-SAT 两阶段排产（排序 + 换型 2-opt，seed 可复现）→
  多工序 Job-Shop（前序约束，ft06 达最优 55）→ 设备直连（Modbus TCP / DNC / REST /
  作业单，dry-run 先确认）→ 闭环（报工 / 台账 / 急单重排 / 执行校准）。
  多通道网关（微信/钉钉/企微/飞书）+ 输出三件套简报 + 5-Sheet 可核查 Excel。
  行业规则经 config/industry_*.json 适配，引擎核心不绑定任何企业。
author: Johnson369218
email: kwoko_china@126.com
license: MIT
homepage: https://github.com/Johnson369218/aps-engine
repository: https://github.com/Johnson369218/aps-engine.git
entry: SKILL.md
engine: aps_engine.api.solve
priority: default|ahp（aps_engine.ahp，几何均值法+CR 一致性）
requires:
  python: ">=3.10"
  packages: [ortools, openpyxl, scikit-learn]
  optional: [fastapi, uvicorn, timesfm(torch), xgboost]
capabilities:
  - scheduling: cp-sat|heuristic（两阶段：排序 + 换型 2-opt）
  - audit: 6 项一致性（prod_date/early_days/tardy/前后工序衔接）
  - priority: ahp（6 因素几何均值 + CR）
  - forecast: 多模型择优（dow_factor/wma4/naive7/gbdt/timesfm/ensemble）
  - probability: bootstrap 蒙特卡洛（P10/P50/P90 + 超载概率）
  - export: 21 列 Excel（公式联动）+ 甘特图 + 汇总
  - server: FastAPI（/api/health /api/schedule）
industry_config: config/industry_example.json
outputs:
  - output/schedule.json          # 引擎结果
  - output/排产表-<日期>.xlsx     # 公式联动版（VLOOKUP/SUMIFS/COUNTIFS 勾稽 + fullCalcOnLoad，可核查）
  - output/monte_carlo_*.json     # 概率层结果
validation:
  - tests/test_solve.py           # 参考试点回归（仅本地，需客户数据）
  - tests/eval_suite.py --quick   # 公开数据集评测（12 场景，通用可靠性）
